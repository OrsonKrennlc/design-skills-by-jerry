<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.github.build_revision }}">
    {% include head-custom.html %}
  </head>
  <body>
    <a class="skip-link" href="#content">跳到正文</a>
    <div class="wrapper">
      <header>
        <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
        <p>{{ site.description }}</p>
        <nav class="site-nav" aria-label="文档导航">
          <ul>
            {% for item in site.navigation %}
            <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
            {% endfor %}
          </ul>
        </nav>
        <p class="view"><a href="{{ site.github.repository_url }}">查看 GitHub 仓库</a></p>
      </header>
      <section id="content" tabindex="-1" aria-label="正文">
        {{ content }}
      </section>
      <footer>
        <p><small>托管于 <a href="https://pages.github.com/">GitHub Pages</a><br>使用 <a href="https://github.com/pages-themes/minimal">Minimal</a> 主题</small></p>
      </footer>
    </div>
    <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
  </body>
</html>
